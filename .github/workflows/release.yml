name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            platform: linux
            bin-dir: target/x86_64-unknown-linux-gnu/release
          - name: windows-x86_64
            os: windows-latest
            platform: windows
            bin-dir: target/x86_64-pc-windows-msvc/release
          - name: macos-aarch64
            os: macos-latest
            platform: macos
            bin-dir: target/aarch64-apple-darwin/release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Use CI cargo config
        shell: pwsh
        run: Copy-Item .cargo/config.ci.toml .cargo/config.toml

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Sync Cargo.toml version to release tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY'
          import pathlib, re, sys
          v = sys.argv[1]
          p = pathlib.Path("Cargo.toml")
          text = p.read_text()
          text, n = re.subn(r'^version = "[^"]+"',
                            f'version = "{v}"',
                            text, count=1, flags=re.MULTILINE)
          if n != 1:
              sys.exit("failed to patch version in Cargo.toml")
          p.write_text(text)
          PY
          grep '^version' Cargo.toml | head -1

      - name: Build release binaries
        run: cargo release-${{ matrix.platform }}

      - name: Smoke-test release binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            bin="${{ matrix.bin-dir }}/wow-sim.exe"
          else
            bin="${{ matrix.bin-dir }}/wow-sim"
          fi
          echo "--- ${bin} --version ---"
          "${bin}" --version
          expected="wow-sim ${GITHUB_REF_NAME#v}"
          actual="$("${bin}" --version)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "version mismatch: expected '${expected}', got '${actual}'" >&2
            exit 1
          fi

      - name: Package Linux release
        if: runner.os == 'Linux'
        id: package-linux
        shell: bash
        run: |
          set -euo pipefail
          name="wow-ui-sim-${GITHUB_REF_NAME}-${{ matrix.name }}"
          root="dist/${name}"

          mkdir -p "${root}"
          cp "${{ matrix.bin-dir }}/wow-sim" "${root}/"
          cp README.md LICENSE "${root}/"
          mkdir -p "${root}/Interface/AddOns"
          cp -R Interface/AddOns/Admin Interface/AddOns/SimCommands Interface/AddOns/TestFramework "${root}/Interface/AddOns/"

          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          echo "asset=dist/${name}.tar.gz" >> "${GITHUB_OUTPUT}"

      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ github.ref_name }}-${{ matrix.name }}
          path: ${{ steps.package-linux.outputs.asset }}

      - name: Package macOS release
        if: runner.os == 'macOS'
        id: package-macos
        shell: bash
        run: |
          set -euo pipefail
          name="wow-ui-sim-${GITHUB_REF_NAME}-${{ matrix.name }}"
          version="${GITHUB_REF_NAME#v}"
          app="dist/WoW Sim.app"
          contents="${app}/Contents"

          # Generate the source PNG for the iconset (also writes the ICO,
          # which is unused on macOS).
          cargo run --example gen_app_icon

          # Build a multi-size iconset from the rendered PNG and convert
          # to .icns. Source is 128x128, so larger sizes are upscaled.
          iconset="dist/wow-sim.iconset"
          rm -rf "${iconset}"
          mkdir -p "${iconset}"
          for size in 16 32 64 128 256 512 1024; do
            sips -z "$size" "$size" installer/wow-sim.png \
              --out "${iconset}/icon_${size}x${size}.png" >/dev/null
          done
          # Retina variants for sizes <= 512 (point size + @2x suffix).
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" installer/wow-sim.png \
              --out "${iconset}/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "${iconset}" -o "dist/wow-sim.icns"

          # Assemble the .app bundle.
          rm -rf "${app}"
          mkdir -p "${contents}/MacOS" "${contents}/Resources/Interface/AddOns"
          cp "${{ matrix.bin-dir }}/wow-sim" "${contents}/MacOS/wow-sim"
          chmod +x "${contents}/MacOS/wow-sim"
          cp dist/wow-sim.icns "${contents}/Resources/wow-sim.icns"
          cp -R Interface/AddOns/Admin Interface/AddOns/SimCommands Interface/AddOns/TestFramework \
            "${contents}/Resources/Interface/AddOns/"

          # Ad-hoc codesign so macOS reports "unidentified developer"
          # rather than the misleading "damaged and can't be opened"
          # Gatekeeper error on first launch of a quarantined download.
          # The "-" identity is the ad-hoc signature: no Apple Developer
          # cert needed, no notarization, no $99/yr account. Users still
          # need to right-click -> Open to bypass Gatekeeper once.
          cat > "${contents}/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>WoW Sim</string>
            <key>CFBundleDisplayName</key>     <string>WoW Sim</string>
            <key>CFBundleIdentifier</key>      <string>net.osso.wow-ui-sim</string>
            <key>CFBundleVersion</key>         <string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key>      <string>wow-sim</string>
            <key>CFBundleIconFile</key>        <string>wow-sim</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>LSMinimumSystemVersion</key>  <string>11.0</string>
            <key>NSHighResolutionCapable</key> <true/>
          </dict>
          </plist>
          PLIST

          # Ad-hoc sign the assembled bundle. --deep covers any nested
          # frameworks (none today, but cheap insurance).
          codesign --force --deep --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

          # Stage a DMG layout: the .app + a symlink to /Applications so
          # users drag-to-install.
          stage="dist/dmg-stage"
          rm -rf "${stage}"
          mkdir -p "${stage}"
          cp -R "${app}" "${stage}/"
          ln -s /Applications "${stage}/Applications"
          cp README.md LICENSE "${stage}/"

          dmg="dist/${name}.dmg"
          rm -f "${dmg}"
          hdiutil create -volname "WoW Sim ${version}" \
            -srcfolder "${stage}" \
            -ov -format UDZO \
            "${dmg}"

          echo "asset=${dmg}" >> "${GITHUB_OUTPUT}"

      - name: Upload macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ github.ref_name }}-${{ matrix.name }}
          path: ${{ steps.package-macos.outputs.asset }}

      - name: Package Windows release
        if: runner.os == 'Windows'
        id: package-windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "wow-ui-sim-$env:GITHUB_REF_NAME-${{ matrix.name }}"
          $root = "dist\$name"

          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item "${{ matrix.bin-dir }}\wow-sim.exe" $root
          Copy-Item README.md, LICENSE $root
          New-Item -ItemType Directory -Force "$root\Interface\AddOns" | Out-Null
          Copy-Item Interface\AddOns\Admin, Interface\AddOns\SimCommands, Interface\AddOns\TestFramework "$root\Interface\AddOns\" -Recurse

          Compress-Archive -Path $root -DestinationPath "dist\$name.zip" -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc ".\installer\wow-ui-sim.iss" `
            "/DAppVersion=$env:GITHUB_REF_NAME" `
            "/DSourceDir=$((Resolve-Path $root).Path)" `
            "/DOutputDir=$((Resolve-Path dist).Path)" `
            "/DOutputBaseFilename=$name-setup"

          "asset=dist/$name*" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: wow-ui-sim-${{ github.ref_name }}-${{ matrix.name }}
          path: ${{ steps.package-windows.outputs.asset }}

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
