[package]
name = "wow-ui-sim"
version = "0.1.0"
edition = "2024"
description = "World of Warcraft UI simulator for addon development"
license = "GPL-3.0-only"
default-run = "wow-sim"

[workspace]
members = [".", "xtask"]

[dependencies]
# mlua removed — rilua is the sole Lua VM
rilua = { git = "https://github.com/Osso/rilua.git" }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = "0.25"
image-blp = "1"
tokio = { version = "1", features = ["sync", "rt", "time"] }
libc = "0.2"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
regex = "1"
walkdir = "2"
phf = { version = "0.11", features = ["macros"] }
phf_codegen = "0.11"
rodio = { version = "0.21", optional = true }

# Iced GUI (optional, gated behind "gui" feature)
iced = { version = "0.14.0", optional = true, features = ["advanced", "canvas", "image", "tokio", "wgpu"] }
iced-dynamic = { path = "iced-dynamic", optional = true }
iced_wgpu = { version = "0.14", optional = true, path = "iced-wgpu-patched" }
iced_runtime = { version = "0.14", optional = true }
iced-layout-inspector = { git = "https://github.com/Osso/iced-layout-inspector.git", tag = "v0.2.0", optional = true }

# Text rendering
cosmic-text = "0.15"

# GPU rendering (optional, gated behind "gui" feature)
wgpu = { version = "27.0", optional = true }
bytemuck = { version = "1.21", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
webp = { version = "0.3.1", optional = true }
rustc-hash = "2.1.2"
asset-resolver = { git = "https://github.com/world-of-osso/asset-resolver", rev = "f5eabfe200650ebe6c6059308b26531d1aa17562", optional = true }

[[bin]]
name = "wow-sim"
path = "src/bin/wow_sim/main.rs"

[[bin]]
name = "wow-cli"
path = "src/bin/wow_cli/main.rs"

[dev-dependencies]
insta = "1.42"
pollster = "0.4"
tempfile = "3"
sha2 = "0.10"

[features]
# fast-build is on by default so local dev/debug builds get the iced dylib for
# faster incremental rebuilds. Release builds should use:
#   cargo build --release --no-default-features --features sound,gui
# to produce a fully static binary not tied to a specific rustc version.
default = ["sound", "gui", "casc", "fast-build"]
sound = ["rodio"]
gui = ["casc", "dep:iced", "dep:iced_wgpu", "dep:iced_runtime", "dep:wgpu", "dep:iced-layout-inspector", "dep:pollster", "dep:bytemuck", "dep:webp"]
casc = ["dep:asset-resolver"]
fast-build = ["gui", "dep:iced-dynamic"]
rehash-stats = ["rilua/rehash-stats"]
intern-stats = ["rilua/intern-stats"]

[profile.release]
lto = false
debug = "line-tables-only"

[profile.dev]
lto = false
debug = "line-tables-only"

[[test]]
name = "frame_positions"
harness = false

# The `server` feature of iced-layout-inspector pulls in peercred-ipc, which is
# Linux-only (uses SO_PEERCRED). Enable it only on unix targets.
[target.'cfg(unix)'.dependencies]
iced-layout-inspector = { git = "https://github.com/Osso/iced-layout-inspector.git", tag = "v0.2.0", features = ["server"], optional = true }

[patch.crates-io]
iced_wgpu = { path = "iced-wgpu-patched" }
